<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">GridIntelBD — underground grid impact for Bangladesh</title>
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB36B"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0" r="0.9">
      <stop stop-color="#FF6B2C" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FF6B2C" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#F2F0EC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="300" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#050506"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="27.5" fill="none" stroke="#F2F0EC" stroke-opacity="0.08"/>

  <g transform="translate(64 44)">
    <rect width="58" height="58" rx="15" fill="#101013"/>
    <rect x="0.5" y="0.5" width="57" height="57" rx="14.5" fill="none" stroke="#FF6B2C" stroke-opacity="0.32"/>
    <g transform="translate(15 13) scale(1.2)">
      <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z" fill="url(#bolt)"/>
    </g>
  </g>

  <text x="140" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="3.4" fill="#8A8A93" textLength="318" lengthAdjust="spacing">CREDOSIS INTERNSHIP · PHASE 02</text>
  <text x="140" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="3.4" fill="#FF6B2C" textLength="150" lengthAdjust="spacing">FRONTEND TRACK</text>

  <text x="64" y="216" font-family="'Inter Tight','Segoe UI',system-ui,-apple-system,sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#F2F0EC" textLength="636" lengthAdjust="spacing">GRIDINTELBD</text>
  <text x="742" y="216" font-family="'Inter Tight','Segoe UI',system-ui,-apple-system,sans-serif" font-size="78" font-weight="800" letter-spacing="4" fill="#FF6B2C" textLength="92" lengthAdjust="spacing">///</text>

  <text x="64" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2.8" fill="#5E5E66" textLength="404" lengthAdjust="spacing">UNDERGROUNDING THE THEFT-PRONE FEEDER</text>
  <text x="1136" y="256" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2.8" fill="#5E5E66" textLength="196" lengthAdjust="spacing">MODEL · MEASURE</text>
</svg>
